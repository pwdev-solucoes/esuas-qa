# Docker Compose para QA Repository Standalone
# Baseado em docker-compose-staging.yml do meta-repo, adaptado para repos/ local
# Volumes: ./repos/api (não ../api como no meta-repo)

services:
  app:
    build:
      context: ./repos/api
      dockerfile: ../../docker/staging/php/Dockerfile
    container_name: esuas_app
    restart: unless-stopped
    volumes:
      - ./repos/api:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  nginx:
    image: nginx:1.27-alpine
    container_name: esuas_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"   # E2E usa :8090 (não :8080 como no dev)
    volumes:
      - ./repos/api:/var/www:ro
      - ./docker/staging/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - backend

  worker:
    build:
      context: ./repos/api
      dockerfile: ../../docker/staging/php/Dockerfile
    container_name: esuas_worker
    restart: unless-stopped
    command: php artisan queue:work --queue=high,default,low --tries=3 --timeout=90 --sleep=3 --max-time=3600
    volumes:
      - ./repos/api:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  worker-imports:
    build:
      context: ./repos/api
      dockerfile: ../../docker/staging/php/Dockerfile
    container_name: esuas_worker_imports
    restart: unless-stopped
    command: php artisan queue:work --queue=dne,cadunico,geo,siap --tries=1 --timeout=7200 --sleep=5 --max-time=3600
    volumes:
      - ./repos/api:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_QUEUE_RETRY_AFTER: 7800
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  postgres:
    image: 'imresamu/postgis:18-3.6'
    container_name: esuas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: esuas_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
